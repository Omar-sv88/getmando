<button
  class="w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl h-full p-6 cursor-pointer flex flex-col items-center text-center transition-all duration-300 hover:bg-white/15 hover:shadow-2xl hover:border-white/30 hover:-translate-y-1 hover:scale-105 group"
  type="button"
  [attr.aria-label]="cardLabel()"
  (click)="openApp()"
>
  <!-- Icon container -->
  <div class="relative mb-4">
    <img
      class="h-16 w-auto object-cover transition-all duration-300 group-hover:scale-110"
      loading="lazy"
      [alt]="app().name + ' icon'"
      [src]="iconUrl()"
    />
    @if (status(); as status) {
      <!-- Decorative: the up/down state is announced through the button's aria-label (see
           cardLabel). The glyph (check / cross) is the non-colour cue for WCAG 1.4.1; the badge
           stays a circle in both states. -->
      <span
        aria-hidden="true"
        [attr.data-status]="status.status"
        class="absolute -top-2 -right-6 grid size-4 place-items-center rounded-full text-white ring-2 ring-white/70 transition-all duration-300"
        [class.bg-emerald-500]="status.status === 'up'"
        [class.bg-red-500]="status.status === 'down'"
      >
        <ng-icon class="text-[0.7rem]" [name]="statusIcon()" />
      </span>
    }
  </div>

  <!-- App info -->
  <div class="flex flex-col items-center text-center flex-1">
    <p
      class="font-semibold text-neutral-800 dark:text-white text-lg mb-2 group-hover:text-neutral-800/90 dark:group-hover:text-white/90 transition-all duration-300"
    >
      {{ app().name }}
    </p>

    @if (showDescriptions()) {
      <p
        class="text-sm text-neutral-800/70 dark:text-white/70 line-clamp-2 group-hover:text-neutral-800/80 dark:group-hover:text-white/80 transition-all duration-300"
      >
        {{ app().description }}
      </p>
    }

    @if (showLabels() && app().tags.length > 0) {
      <div class="flex flex-wrap gap-1 mt-3 justify-center">
        @for (tag of app().tags; track tag) {
          <span
            class="px-2 py-1 text-xs bg-white/10 rounded-full text-neutral-800/60 dark:text-white/60 group-hover:bg-white/20 transition-all duration-300"
          >
            {{ tag }}
          </span>
        }
      </div>
    }
  </div>

  <!-- Focus indicator -->
  <div
    class="absolute inset-0 rounded-3xl ring-2 ring-white/0 focus-visible:ring-white/50 transition-all duration-300 pointer-events-none"
  ></div>
</button>
